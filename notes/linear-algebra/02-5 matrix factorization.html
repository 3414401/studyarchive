<h2>Matrix Factorization</h2>
<P>Factorization = 인수분해</P>
<br>
<div class="note-box">
  <h3>왜 LU분해를 하는가?</h3>
<p>Ax=b의 풀이법</p>
<p>1️⃣ A가 가역행렬이라면(det검사), x=A<sup>-1</sup>b를 구한다.</p>
<p>2️⃣ 🔖LUx=b ⇔ Ly=b, Ux=y ⇔ y=L<sup>-1</sup>b, x=U<sup>-1</sup>y 를 구한다.</p>
</div>
